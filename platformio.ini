[platformio]
default_envs = esp32dev  ; pick the board in the VS Code status bar, or: pio run -e xiao_esp32c3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time  ; prefix each serial line with the PC clock (like ESPHome)
board_build.partitions = min_spiffs.csv  ; two ~1.9MB app slots -> required for web OTA
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    knolleary/PubSubClient@^2.8

; Seeed Studio XIAO ESP32-C3: connect the supplied external antenna (U.FL) before powering it
[env:xiao_esp32c3]
extends = env:esp32dev
board = seeed_xiao_esp32c3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1  ; serial log on the native USB-C port

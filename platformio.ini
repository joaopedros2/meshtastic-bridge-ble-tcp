[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time  ; prefix each serial line with the PC clock (like ESPHome)
board_build.partitions = min_spiffs.csv  ; two ~1.9MB app slots -> required for web OTA
lib_deps =
    bblanchon/ArduinoJson@^7.2
    h2zero/NimBLE-Arduino@^2.1.0
    knolleary/PubSubClient@^2.8
